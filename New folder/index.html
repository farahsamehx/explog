<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Export Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: TV = race lanes across a quay-to-sea strip + live board on the right + mission panel below.
   Phone = one-thumb column: ship header, four gauges, mission card, answer pads, tabs. */
:root{
  --sea-deep:#0a1a33;   /* night sea, page ground */
  --panel:#0f2747;      /* bridge console */
  --line:#2a5378;       /* rivets and frames */
  --sea:#14476b;
  --sea-hi:#1f6b92;
  --quay:#3b4757;       /* Alexandria concrete */
  --foam:#eaf4f2;       /* headline text */
  --ink:#c9dde7;        /* body text */
  --dim:#7d9ab0;
  --signal:#ff8a3d;     /* crane orange, the one loud colour */
  --paper:#ffd447;      /* document yellow */
  --ok:#4fd27f;
  --bad:#ff5a6e;
  --opt-a:#ff8a3d; --opt-b:#ffd447; --opt-c:#2fc7b0; --opt-d:#6c93ff;
  --display:"Rubik", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sea-deep);color:var(--ink);font-family:var(--body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{height:100%}
h1,h2,h3{font-family:var(--display);color:var(--foam);font-weight:700;text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.ship{display:block;width:100%;height:auto;image-rendering:pixelated}
.btn{font-family:var(--display);font-size:17px;letter-spacing:.04em;color:#1a0c02;background:var(--signal);border:0;
  padding:16px 20px;cursor:pointer;text-transform:uppercase;line-height:1.4;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.3),0 5px 0 #7a3a10;transition:transform .05s;font-weight:700}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.3),0 1px 0 #7a3a10}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:not-allowed}
.btn.alt{background:var(--sea-hi);color:var(--foam);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.15),0 5px 0 #0b2a40}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.frame{background:var(--panel);box-shadow:0 0 0 3px var(--line),0 0 0 6px #06101f}
.waves{background:
  repeating-linear-gradient(90deg,transparent 0 22px,rgba(234,244,242,.10) 22px 30px,transparent 30px 52px) 0 30%/52px 100%,
  repeating-linear-gradient(90deg,transparent 0 10px,rgba(234,244,242,.07) 10px 16px,transparent 16px 40px) 0 72%/40px 100%,
  linear-gradient(var(--sea),var(--sea-deep));animation:drift 6s steps(13) infinite}
@keyframes drift{to{background-position:52px 30%,-40px 72%,0 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tag{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.bot{font-family:var(--display);font-size:10px;color:#1a0c02;background:var(--dim);padding:2px 4px;vertical-align:middle;margin-left:4px;font-weight:700}

/* ---------- brand (only shown when a logo file is supplied) ---------- */
.brand-tile{display:inline-grid;place-items:center;background:#fff;padding:.5em;box-shadow:0 0 0 3px var(--line),0 0 0 6px #06101f;line-height:0}
.brand-tile img{display:block;width:auto;max-width:none;height:5em}
.brand-tile.lg img{height:7em}.brand-tile.md img{height:6em}.brand-tile.sm{padding:.25em .35em}.brand-tile.sm img{height:2.6em}
.brand-tile.ph img{height:72px}
.brand-line{font-family:var(--display);font-size:0.91em;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;line-height:1.6;font-weight:700}
.land .brand-row{display:grid;justify-items:center;gap:12px}
.land .brand-tile img{height:110px}
.land .brand-line{font-size:11px}
/* ---------- landing ---------- */
#landing{min-height:100%;display:grid;place-items:center;padding-block:32px}
.land{max-width:640px;width:100%;display:grid;gap:28px;text-align:center}
.logo{font-family:var(--display);color:var(--foam);font-size:clamp(28px,7vw,56px);line-height:1.1;text-shadow:4px 4px 0 var(--signal),8px 8px 0 #06101f;font-weight:700}
.land p{margin:0;font-size:19px;line-height:1.5}
.land .hero-ship{width:min(260px,70%);margin:0 auto;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.land-actions{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.land-card{padding:20px;display:grid;gap:14px;text-align:left}
.land-card h2{font-size:16px}
.land-card p{font-size:16px;color:var(--ink)}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--dim);font-weight:700}
.field input{font-family:var(--display);font-size:21px;background:#071428;color:var(--foam);border:0;box-shadow:inset 0 0 0 3px var(--line);padding:14px;width:100%;box-sizing:border-box;font-weight:700}
.field input:focus{box-shadow:inset 0 0 0 3px var(--paper);outline:none}
.note{font-size:14px;color:var(--dim);line-height:1.5}

/* ---------- TV ---------- */
#tv{height:100%;font-size:clamp(11px,1.05vw,24px)}
.tvlobby{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:3em;align-items:center;padding-block:2em}
.lob-left{display:grid;justify-items:center;gap:1.1em;text-align:center}
.lob-left .logo{font-size:3.4em}
.scan{font-family:var(--display);font-size:1.69em;color:var(--paper);letter-spacing:.1em;font-weight:700}
.qrbox{background:#fff;padding:1em;box-shadow:0 0 0 .4em var(--signal),0 0 0 .8em #06101f;width:15em;height:15em;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important;image-rendering:pixelated}
.qrbox .noqr{color:#0a1a33;font-family:var(--display);font-size:0.91em;line-height:1.6;font-weight:700}
.pinrow{display:flex;gap:1em;align-items:baseline}
.pin{font-family:var(--display);font-size:3.9em;color:var(--foam);letter-spacing:.12em;font-weight:700}
.joinurl{font-size:1em;color:var(--dim);word-break:break-all;max-width:28em}
.netline{font-size:1em;padding:.4em .8em;box-shadow:inset 0 0 0 2px var(--line)}
.netline.live{color:var(--ok)} .netline.off{color:var(--paper)}
.lob-right{display:grid;gap:1.4em;align-content:center}
.lob-right h2{font-size:1.82em}
.roster{list-style:none;margin:0;padding:1em;display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.8em;min-height:12em;align-content:start}
.roster li{display:flex;align-items:center;gap:.6em;padding:.5em .6em;background:#0a1d38;box-shadow:inset 0 0 0 2px var(--line);font-size:1.15em;color:var(--foam);animation:pop .3s steps(3)}
.roster li .mini{width:3em;flex:none}
.roster li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.roster li button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1em;padding:0 .2em}
.roster .empty{grid-column:1/-1;color:var(--dim);background:none;box-shadow:none;font-size:1.1em;animation:none}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.botrow{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}
.botrow .tag{font-size:.7em;margin-right:.4em}
.botrow .btn{font-size:.65em;padding:.9em 1.1em}
.startrow{display:flex;gap:1em;align-items:center;flex-wrap:wrap}
.startrow .btn{font-size:1.1em;padding:1em 1.6em}

.tvgame{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:1em;padding-block:1em;position:relative;box-sizing:border-box}
.tvbar{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.tvbar .brand{font-family:var(--display);color:var(--foam);font-size:1.62em;text-shadow:2px 2px 0 var(--signal);font-weight:700}
.stagechip{font-family:var(--display);font-size:1.04em;padding:.6em .9em;background:var(--paper);color:#2a1d00;font-weight:700}
.stagechip.crisis{background:var(--bad);color:#fff}
.stagechip.boss{background:#b06bff;color:#fff}
.tvtimer{font-family:var(--display);font-size:2.08em;color:var(--foam);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right;font-weight:700}
.tvtimer.hot{color:var(--bad)}
.pinchip{font-family:var(--display);font-size:0.98em;color:var(--dim);font-weight:700}
.tvmain{display:grid;grid-template-columns:minmax(0,1fr) 19em;gap:1.2em;align-items:start}
.race{display:grid;grid-template-rows:auto auto;--namew:9.5em;--shipw:4.6em;--laneh:4.5em}
.ruler{display:grid;grid-template-columns:var(--namew) 1fr;height:2.2em}
.ruler .rtrack{position:relative}
.ruler .rlab{position:absolute;top:.4em;transform:translateX(-50%);font-family:var(--display);font-size:0.72em;color:var(--dim);white-space:nowrap;font-weight:700}
.ruler .rlab.now{color:var(--paper)}
.lanes{display:flex;flex-direction:column;gap:3px;background:#06101f;padding:3px}
.lane{display:grid;grid-template-columns:var(--namew) 1fr;height:var(--laneh)}
.lname{display:flex;flex-direction:column;justify-content:center;padding:0 .6em;background:var(--panel);min-width:0}
.lname b{font-family:var(--display);font-size:0.81em;color:var(--foam);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5;font-weight:700}
.lname small{font-size:.85em;color:var(--dim);font-variant-numeric:tabular-nums}
.track{position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--quay) 0 72%,transparent 72% 95%,#5a4630 95% 100%)}
.track::before{content:"";position:absolute;inset:0;left:72%;right:5%;
  background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(234,244,242,.12) 14px 20px,transparent 20px 34px),var(--sea);
  animation:drift2 5s steps(10) infinite}
@keyframes drift2{to{background-position:34px 0,0 0}}
.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/12 - 2px),rgba(0,0,0,.25) calc(100%/12 - 2px) calc(100%/12));pointer-events:none}
.lane.hl .lname{background:#21486f}
.lane.flash .track{box-shadow:inset 0 0 0 3px var(--paper)}
.shipw{position:absolute;bottom:8%;width:var(--shipw);left:calc((100% - var(--shipw)) * var(--p,0));transition:left 1.1s steps(11);z-index:2}
.shipw .delta{position:absolute;left:50%;bottom:105%;transform:translateX(-50%);font-family:var(--display);font-size:0.91em;white-space:nowrap;animation:rise 1.6s steps(8) forwards;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-1.5em)}}
.lane.docked .shipw::after{content:"⚓";position:absolute;right:-.2em;top:-.9em;font-size:.9em}

.board{padding:1em;display:flex;flex-direction:column;gap:.7em}
.board h3{font-size:0.98em;color:var(--paper);letter-spacing:.08em}
.brow{display:grid;grid-template-columns:2em 3.2em minmax(0,1fr) auto;gap:.5em;align-items:center}
.brow .med{font-size:1.2em;text-align:center}
.brow .nm{font-family:var(--display);font-size:0.75em;color:var(--foam);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.6;font-weight:700}
.brow .sc{font-family:var(--display);font-size:1.3em;color:var(--foam);font-variant-numeric:tabular-nums;font-weight:700}
.brow .gauges{grid-column:3/5;display:grid;grid-template-columns:repeat(4,1fr);gap:.3em;margin-top:-.2em}
.gauge{height:.42em;background:#06101f;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--ok))}
.board .key{margin-top:.4em;display:flex;justify-content:space-between;font-size:.85em;color:var(--dim)}

.panel{padding:1.2em 1.4em;min-height:0;overflow:auto;display:grid;gap:.8em;align-content:start}
.qhead{display:flex;gap:1em;align-items:baseline;flex-wrap:wrap}
.mission{font-family:var(--display);font-size:0.85em;color:var(--paper);letter-spacing:.08em;font-weight:700}
.panel h2{font-size:1.62em}
.qtext{margin:0;font-size:1.45em;line-height:1.35;color:var(--foam);max-width:52em}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.opt{display:flex;gap:.7em;align-items:center;padding:.55em .8em;background:#0a1d38;font-size:1.2em;color:var(--foam);box-shadow:inset .35em 0 0 var(--oc)}
.opt .L{font-family:var(--display);font-size:0.98em;color:#1a0c02;background:var(--oc);padding:.35em .5em;flex:none;font-weight:700}
.opt .pct{margin-left:auto;font-family:var(--display);font-size:0.91em;color:var(--dim);font-weight:700}
.opt.right{background:#173d2a;box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wrong{opacity:.45}
.why{margin:0;font-size:1.15em;line-height:1.4;color:var(--ink);padding:.6em .8em;box-shadow:inset 3px 0 0 var(--paper);background:#0a1d38}
.statusrow{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.chip{font-size:1em;padding:.3em .6em;background:#0a1d38;color:var(--dim);box-shadow:inset 0 0 0 2px var(--line)}
.chip.done{color:var(--foam);box-shadow:inset 0 0 0 2px var(--ok)}
.acount{font-family:var(--display);font-size:0.98em;color:var(--foam);margin-left:auto;font-weight:700}
.tbar{height:.6em;background:#06101f}
.tbar i{display:block;height:100%;background:var(--paper);width:100%}
.locked{font-family:var(--display);color:var(--paper);font-size:1.3em;animation:blink .5s steps(2) 3;font-weight:700}
@keyframes blink{50%{opacity:0}}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.6em}
.res{display:flex;gap:.6em;align-items:center;padding:.5em .7em;background:#0a1d38;animation:pop .25s steps(3)}
.res .mini{width:2.8em;flex:none}
.res b{font-family:var(--display);font-size:0.78em;color:var(--foam);display:block;line-height:1.6;font-weight:700}
.res span{font-size:1.05em}
.res.ok span{color:var(--ok)} .res.no span{color:var(--bad)}
.evcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(16em,1fr));gap:.8em}
.evcard{padding:1em;display:grid;gap:.4em;background:#0a1d38;box-shadow:inset 0 0 0 3px var(--c);animation:pop .3s steps(3)}
.evcard .who{font-family:var(--display);font-size:0.91em;color:var(--foam);font-weight:700}
.evcard .et{font-family:var(--display);font-size:1.3em;color:var(--c);font-weight:700}
.evcard p{margin:0;font-size:1.05em}
.evcard .fx{font-size:1.1em;color:var(--foam)}
.bossline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.4em;align-items:center}
.bossart{width:7em;animation:bob 1s steps(2) infinite}
.bossart.hit{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hp{display:grid;gap:.3em}
.hp .tag{font-size:.6em}
.hpbar{height:1.1em;background:#06101f;box-shadow:inset 0 0 0 2px var(--line)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#b06bff,var(--bad));transition:width .8s steps(8)}
.big{font-family:var(--display);font-size:1.95em;color:var(--foam);font-weight:700}
.controls{margin-left:auto;display:flex;gap:.5em;align-items:center}
.controls .btn{font-size:.6em;padding:.9em 1em}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,16,31,.88);z-index:20;text-align:center}
.count{font-family:var(--display);font-size:11.7em;color:var(--foam);text-shadow:.08em .08em 0 var(--signal);animation:pop .3s steps(3);font-weight:700}
.arrive{display:grid;gap:1.2em;justify-items:center;max-width:44em}
.arrive h1{font-size:2.86em;color:var(--paper)}
.arrive p{font-size:1.4em;margin:0}
.arrive .ship{width:12em;animation:bob 1s steps(2) infinite}
.final{width:min(70em,100%);max-height:100%;overflow:auto;display:grid;gap:1.4em;padding:1.5em;box-sizing:border-box}
.final h1{font-size:2.6em;color:var(--paper)}
.dock{display:flex;justify-content:center;gap:.6em;flex-wrap:wrap}
.dock .mini{width:4em;animation:sail 1.4s steps(7) both}
@keyframes sail{from{transform:translateX(-40vw)}}
.finalgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:1.5em;text-align:left}
.rank{list-style:none;margin:0;padding:1em;display:grid;gap:.6em}
.rank li{display:grid;grid-template-columns:2.2em 3em minmax(0,1fr) auto;gap:.6em;align-items:center;font-size:1.1em}
.rank li .nm{font-family:var(--display);font-size:0.91em;color:var(--foam);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank li .sc{font-family:var(--display);font-size:1.04em;color:var(--paper);font-weight:700}
.rank li small{grid-column:3/5;color:var(--dim);font-size:.85em;margin-top:-.4em}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:.7em;align-content:start}
.award{padding:.8em;display:grid;gap:.3em;background:#0a1d38;box-shadow:inset 0 0 0 2px var(--line)}
.award .at{font-family:var(--display);font-size:0.78em;color:var(--paper);font-weight:700}
.award .aw{font-size:1.2em;color:var(--foam)}
.award small{color:var(--dim)}
.finalbtns{display:flex;gap:1em;justify-content:center;flex-wrap:wrap}
.finalbtns .btn{font-size:.75em}

/* ---------- Phone ---------- */
#phone{max-width:480px;margin:0 auto;padding-block:12px 28px;display:grid;gap:14px}
.phead{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.phead .nm{font-family:var(--display);font-size:17px;color:var(--foam);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.6;font-weight:700}
.phead .sub{font-size:15px;color:var(--dim)}
.phead .score{text-align:right}
.phead .score b{display:block;font-family:var(--display);font-size:29px;color:var(--paper);font-variant-numeric:tabular-nums;font-weight:700}
.netdot{font-size:13px;color:var(--dim)}
.netdot.live{color:var(--ok)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:0 4px}
.bar{display:grid;gap:4px}
.bar .tag{display:flex;justify-content:space-between;font-size:8px}
.bar .meter{height:10px;background:#06101f;box-shadow:inset 0 0 0 2px var(--line);position:relative}
.bar .meter i{position:absolute;inset:2px auto 2px 2px;background:var(--c);transition:width .6s steps(6)}
.card{padding:18px;display:grid;gap:14px}
.card .mission{font-size:10px}
.card h2{font-size:20px}
.card p{margin:0;font-size:19px;line-height:1.4;color:var(--foam)}
.ptimer{font-family:var(--display);font-size:18px;color:var(--foam);font-variant-numeric:tabular-nums;font-weight:700}
.ptimer.hot{color:var(--bad)}
.pads{display:grid;gap:10px}
.pad{display:flex;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;padding:14px 14px;min-height:58px;font-size:18px;line-height:1.25;color:#1a0c02;background:var(--oc);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.3),0 4px 0 rgba(0,0,0,.45)}
.pad:active{transform:translateY(3px)}
.pad .L{font-family:var(--display);font-size:16px;background:rgba(0,0,0,.18);padding:6px 7px;flex:none;font-weight:700}
.pad.picked{outline:4px solid var(--foam);outline-offset:2px}
.pad.dim{opacity:.35}
.pad.right{outline:4px solid var(--ok);outline-offset:2px}
.lockbox{text-align:center;display:grid;gap:10px;padding:10px 0}
.lockbox .big{font-size:18px}
.verdict{font-family:var(--display);font-size:26px;line-height:1.4;font-weight:700}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.fxlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:19px;color:var(--foam)}
.fxlist li.up{color:var(--ok)} .fxlist li.down{color:var(--bad)}
.why.p{font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font-family:var(--display);font-size:10px;line-height:1.5;padding:12px 4px;background:#0a1d38;border:0;color:var(--dim);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;font-weight:700}
.tabs button[aria-selected="true"]{color:#1a0c02;background:var(--paper);box-shadow:none}
.route{list-style:none;margin:0;padding:6px 0;display:grid;gap:0}
.route li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 10px;font-family:var(--display);font-size:13px;color:var(--dim);font-weight:700}
.route li .dot{width:14px;height:14px;background:#06101f;box-shadow:inset 0 0 0 2px var(--line);justify-self:center}
.route li.past{color:var(--ink)} .route li.past .dot{background:var(--line)}
.route li.now{color:#1a0c02;background:var(--paper)} .route li.now .dot{background:var(--signal);box-shadow:none}
.route li .mini{width:44px}
.route .arrow{padding:0 10px 0 17px;color:var(--line);font-size:12px;line-height:1}
.sclist{display:grid;gap:12px}
.scrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:17px}
.scrow b{font-family:var(--display);font-size:14px;color:var(--foam);font-weight:700}
.scrow .meter{grid-column:1/3;height:12px;background:#06101f;position:relative}
.scrow .meter i{position:absolute;inset:0 auto 0 0;background:var(--c)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;background:#0a1d38;font-size:16px}
.lb li.me{box-shadow:inset 0 0 0 2px var(--paper)}
.lb li .nm{font-family:var(--display);font-size:13px;color:var(--foam);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lb li .sc{font-family:var(--display);font-size:16px;color:var(--paper);font-weight:700}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.colors button{background:#0a1d38;border:0;box-shadow:inset 0 0 0 2px var(--line);padding:10px 6px 6px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--ink)}
.colors button[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--paper);background:#173556}
.colors .ship{width:100%}
.err{color:var(--bad);font-size:15px;margin:0}
.bigship{width:min(70%,260px);margin:0 auto;animation:bob 1.4s steps(2) infinite}
.center{text-align:center;justify-items:center}
.takeover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px));text-align:center;background:var(--c);color:#1a0c02}
.takeover .ic{font-size:72px}
.takeover h1{color:#1a0c02;font-size:31px}
.takeover p{font-size:20px;margin:8px 0}
.takeover ul{list-style:none;padding:0;margin:0;font-size:22px;font-weight:700}
.takeover small{display:block;margin-top:18px;font-size:14px;opacity:.75}
.bossmini{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
@media (max-width:900px){
  .tvlobby{grid-template-columns:1fr;height:auto}
  .tvmain{grid-template-columns:1fr}
  .board{max-height:14em}
  .opts{grid-template-columns:1fr}
  .finalgrid,.awards{grid-template-columns:1fr}
  .tvgame{height:auto;grid-template-rows:auto auto auto}
}
</style>

  <section id="landing"></section>
  <section id="tv" hidden></section>
  <section id="phone" hidden></section>
</div>
<div id="takeover" class="takeover" hidden></div>

      horn:[[147,.6]], move:[[440,.05],[520,.05]], boss:[[110,.3],[98,.45]], hit:[[300,.05],[200,.08]], fanfare:[[523,.1],[659,.1],[784,.1],[1047,.3]]}[type];

const Net = {kind:'none', room:null, user:null, ready:null};
Net.ready = (async () => {
  if (window.claude && typeof window.claude.use === 'function'){
    try { const room = await window.claude.use('room');
      if (room){ Net.kind = 'room'; Net.room = room; try { Net.user = await window.claude.use('user'); } catch {} return; } } catch {}
    Net.kind = 'none'; return;
  }
  Net.kind = window.Peer ? 'peer' : 'none';
})();

async function hostNet(pin, onMsg, onLeave){
  await Net.ready;
  if (Net.kind === 'room'){
    if (Net.user && typeof Net.user.canEdit === 'function' && !Net.user.canEdit()) throw new Error('owner');
    const r = await Net.room.join('eq-' + pin);
    const peerCid = {};
    r.onPeers(ch => {
      for (const p of [...ch.joined, ...ch.updated]){
        if (p.sameTab) continue;
        const m = p.presence && p.presence.m;
        if (m && typeof m === 'object' && typeof m.cid === 'string'){
          peerCid[p.peer] = m.cid;
          onMsg({t:'hello', cid:m.cid, name:m.name, color:m.color});
          if (m.a && typeof m.a === 'object') onMsg({t:'ans', cid:m.cid, q:m.a.q, c:m.a.c});
        }
      }
      for (const p of ch.left){ const c = peerCid[p.peer]; if (c) onLeave(c); }
      if (ch.joined.length) push();
    });
    return {send(s){ r.emit('state', s).catch(() => {}); }, live:true, label:'Live: players join through this claude.ai link'};
  }
  if (Net.kind === 'peer'){
    return new Promise((res, rej) => {
      const peer = new Peer('exportquest-' + pin, {debug:0});
      const conns = new Set(); let done = false;
      peer.on('open', () => { done = true; res({send(s){ conns.forEach(c => { if (c.open) try { c.send(s); } catch {} }); }, live:true, label:'Live: phones can join'}); });
      peer.on('connection', c => {
        conns.add(c);
        c.on('data', m => { if (m && typeof m.cid === 'string'){ c._cid = m.cid; onMsg(m); } });
        c.on('open', () => push());
        c.on('close', () => { conns.delete(c); if (c._cid) onLeave(c._cid); });
        c.on('error', () => {});
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
      peer.on('error', e => { if (!done){ done = true; rej(e); } });
      setTimeout(() => { if (!done){ done = true; rej(new Error('timeout')); } }, 12000);
    });
  }
  throw new Error('none');
}

async function joinNet(pin, onState, onStatus){
  await Net.ready;
  if (Net.kind === 'room'){
    const r = await Net.room.join('eq-' + pin);
    r.on('state', msg => { if (msg && msg.data && typeof msg.data === 'object') onState(msg.data); });
    if (r.onConnection) r.onConnection(ok => onStatus(ok ? 'live' : 'reconnecting'));
    let pres = {};
    return {send(m){
      if (m.t === 'hello') pres = {cid:m.cid, name:m.name, color:m.color, a:pres.a || null};
      else if (m.t === 'ans') pres = Object.assign({}, pres, {a:{q:m.q, c:m.c}});
      r.presence({m:pres}).catch(() => {});
    }};
  }
  if (Net.kind === 'peer'){
    let peer = null, conn = null, hello = null, queue = [], pending = false;
    const retry = (ms) => { if (pending) return; pending = true; setTimeout(() => { pending = false; if (conn && conn.open) return;
      if (peer && !peer.destroyed && peer.open) connect(); else { try { peer && peer.destroy(); } catch {} peer = null; open(); } }, ms); };
    const connect = () => {
      conn = peer.connect('exportquest-' + pin, {reliable:true});
      conn.on('open', () => { onStatus('live'); if (hello) conn.send(hello); queue.forEach(m => conn.send(m)); queue = []; });
      conn.on('data', d => { if (d && typeof d === 'object') onState(d); });
      conn.on('close', () => { onStatus('reconnecting'); retry(1500); });
      conn.on('error', () => {});
    };
    const open = () => {
      peer = new Peer(undefined, {debug:0});
      peer.on('open', connect);
      peer.on('error', e => { onStatus(e && e.type === 'peer-unavailable' ? 'nohost' : 'reconnecting'); retry(2500); });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
    };
    open();
    return {send(m){ if (m.t === 'hello') hello = m; if (conn && conn.open) conn.send(m); else if (m.t !== 'hello') queue.push(m); }};
  }
  throw new Error('none');
}

function applyFx(P, fx){
  const out = [];
  if (fx.pts){ P.pts += fx.pts; out.push(`+${fx.pts} points`); }
  if (fx.move){
    let m = fx.move;
    if (m > 0 && P.holdNext){ P.holdNext = false; out.push('Customs hold: no move'); m = 0; }
    const b = P.pos; P.pos = Math.max(0, Math.min(TRACK, P.pos + m)); const d = P.pos - b;
    if (d) out.push(`${d > 0 ? '+' : ''}${d} space${Math.abs(d) > 1 ? 's' : ''}`);
    if (P.pos >= TRACK && !P.arr) P.arr = ++H.arrivals;
  }
  for (const k of ['docs','time','cost','cust']) if (fx[k]){
    P.st[k] = Math.max(0, Math.min(STAT[k].max, P.st[k] + fx[k]));
    out.push(`${fx[k] > 0 ? '+' : ''}${fx[k]} ${STAT[k].n}`);

function resolveQ(){

  const counts = q.o.map(() => 0); const items = [];

      } else { fx = Object.assign({}, opt.fx || q.bad || {docs:-3, time:-2}); h = opt.h || q.h || 'DELAY'; }

function resolveBoss(){

function doEvents(){
  const ps = plist(); if (!ps.length) return nextStep();
  const n = ps.length <= 3 ? 1 : ps.length <= 7 ? 2 : 3;
  const targets = shuffle(ps).slice(0, n);
  H.evSeq++;
  H.events = targets.map(P => {
    const e = EVENTS[rnd(0, EVENTS.length - 1)];
    const lines = applyFx(P, Object.assign({}, e.fx));
    P.last = {ok:e.good, h:e.t, m:e.d, fx:lines, q:'ev' + H.evSeq, ic:e.ic};
    return {cid:P.cid, t:e.t, ic:e.ic, d:e.d, good:e.good, lines};
  });
  setPhase('event');
  startAnim(H.events.map(e => ({cid:e.cid, ok:e.good, txt:e.t})));
  push();
}
function afterResolution(){
  if (H.finalTurn) return toFinal();
  if (!H.arrivedShown && plist().some(P => P.pos >= TRACK)){ H.arrivedShown = true; setPhase('arrived'); sfx('horn'); push(); return; }
  nextStep();
}
function onNext(){
  if (!H) return;
  if (H.anim && !H.anim.done){ finishAnim(); return; }
  switch (H.phase){
    case 'reveal': case 'event': case 'bossEnd': return afterResolution();
    case 'bossIntro': return startBossQ();
    case 'bossReveal': return (H.boss.hp <= 0 || H.boss.n >= BOSS_MAX) ? endBoss() : startBossQ();
    case 'arrived': H.finalTurn = true; return startQuestion(pickQ(), 'q');
    case 'question': case 'boss': return lockNow();
  }
}
function toFinal(){
  const r = sorted();
  const best = (fn, need) => { const vals = r.map(fn); const mx = Math.max(...vals); if (need && mx <= 0) return []; return r.filter(P => fn(P) === mx).map(P => P.name); };
  const first = r.filter(P => P.arr).sort((a,b) => a.arr - b.arr)[0];
  H.final = {rank:r.map(P => P.cid), aw:[
    {ic:'🏆', t:'EXPORT CHAMPION', d:'Highest total score', w: r.length ? [r[0].name] : []},
    {ic:'📄', t:'DOCUMENT MASTER', d:'Best document accuracy', w:best(P => P.st.docs)},
    {ic:'⚡', t:'FASTEST VESSEL', d: first ? 'First ship to destination' : 'Furthest along the route', w: first ? [first.name] : best(P => P.pos)},
    {ic:'💰', t:'COST CONTROLLER', d:'Best cost score', w:best(P => P.st.cost)},
    {ic:'❤️', t:'CUSTOMER HERO', d:'Best customer score', w:best(P => P.st.cust)},
    {ic:'🚨', t:'CRISIS MASTER', d:'Most crisis calls right', w:best(P => P.crisisOk, true)}]};
  setPhase('final'); sfx('fanfare'); push();
}
function playAgain(){ H.plan = PLAN.slice(); H.qOrder = newHost().qOrder; H.cOrder = shuffle(H.cOrder); H.bOrder = shuffle(H.bOrder); setPhase('lobby'); plist().forEach(P => { P.pos = P.dpos = 0; P.st = Object.assign({}, START); P.pts = 0; P.last = null; }); push(); }

function startAnim(items){
  clearTimeout(animTimer);
  const set = new Set(items.map(i => i.cid));
  plist().forEach(P => { if (!set.has(P.cid)) P.dpos = P.pos; });
  H.anim = {items, shown:0, done:false};
  const step = () => {
    if (!H.anim || H.anim.items !== items) return;
    if (H.anim.shown < items.length){
      const it = items[H.anim.shown++]; const P = H.players[it.cid];
      if (P){ it.from = P.dpos; P.dpos = P.pos; }
      sfx(it.ok ? 'move' : 'tick'); renderTV();
      animTimer = setTimeout(step, 900);
    } else { H.anim.done = true; renderTV(); if (H.auto) animTimer = setTimeout(() => { if (H.anim && H.anim.items === items) onNext(); }, 6000); }
  };
  animTimer = setTimeout(step, 700);
}
function finishAnim(){ clearTimeout(animTimer); if (!H.anim) return; H.anim.shown = H.anim.items.length; H.anim.done = true; plist().forEach(P => P.dpos = P.pos); renderTV(); }

function pub(){
  const ph = H.phase;
  const s = {pin:H.pin, ph, v:++H.v, qn:H.qn, lk:H.lockedAt ? 1 : 0,
    ps:plist().map(P => ({i:P.cid, n:P.name, c:P.color, b:P.bot ? 1 : 0, p:P.pos, s:[P.st.time,P.st.docs,P.st.cost,P.st.cust], g:P.pts, a:P.ans != null ? 1 : 0, o:(P.bot || P.conn) ? 1 : 0, l:P.last}))};
  if (H.q && ['question','boss','reveal','bossReveal'].includes(ph)){
    s.q = {id:H.q.id, k:H.q.kind, st:H.q.st, ti:H.q.ti, tx:H.q.tx, o:H.q.o.map(o => o.t), rem:Math.max(0, H.qEndAt - Date.now()), dur:H.q.dur};
    if (ph === 'reveal' || ph === 'bossReveal'){ s.ok = H.q.o.findIndex(o => o.ok); s.why = H.q.why; if (H.q.kind === 'crisis') s.dist = H.q.dist; }
  }
  if (ph === 'event' && H.events){ s.ev = H.events.map(e => ({i:e.cid, t:e.t, ic:e.ic})); s.evk = H.evSeq; }
  if (H.boss && ['bossIntro','boss','bossReveal','bossEnd'].includes(ph)) s.boss = {hp:H.boss.hp, n:H.boss.n, last: ph === 'bossReveal' ? H.boss.last : null, end:H.boss.end};
  if (ph === 'arrived'){ const f = plist().find(P => P.arr === 1); s.ar = f ? f.name : ''; }
  if (ph === 'countdown') s.cd = Math.max(0, 4200 - (Date.now() - H.cdAt));
  if (ph === 'final' && H.final) s.fin = H.final;
  let txt = JSON.stringify(s);
  if (Net.kind === 'room' && txt.length > 3900){ s.ps.forEach(p => { if (p.l) p.l = {ok:p.l.ok, h:p.l.h, fx:p.l.fx.slice(0,3), q:p.l.q}; }); delete s.why; txt = JSON.stringify(s); }
  if (Net.kind === 'room' && txt.length > 3900){ s.ps.forEach(p => { if (p.l) p.l = {ok:p.l.ok, h:p.l.h, fx:[], q:p.l.q}; }); }
  return s;
}
let saveT = 0;
function push(){
  if (!H) return;
  if (link) link.send(pub());
  renderTV();
  const now = Date.now();
  if (now - saveT > 800){ saveT = now; const copy = Object.assign({}, H, {anim:null}); store.set('eq_host', {H:copy, at:now}); }
}
function tick(){
  if (!H) return;
  const now = Date.now();
  if (H.phase === 'question' || H.phase === 'boss'){
    let changed = false;
    for (const P of plist()) if (P.bot && P.ans == null && !H.lockedAt && now >= P.botAt){ P.ans = P.botPick; P.ansAt = now; changed = true; }
    if (!H.lockedAt && (now >= H.qEndAt || allAnswered())){ H.lockedAt = now; changed = true; }
    if (H.lockedAt && now >= H.lockedAt + 1100){ resolve(); return; }
    if (changed) push();
  }
  if (H.phase === 'countdown' && now - H.cdAt >= 4200){ nextStep(); return; }
  updateTimers();
}

    const r = H.final.rank.map(c => H.players[c]).filter(Boolean);
    setHTML(ov, `<div class="final">${BRAND.logo ? `<div>${brandTile('lg')}</div>` : ''}<h1>EXPORT QUEST COMPLETE</h1>${brandLine()}
      <div class="dock">${r.map((P,i) => `<span class="mini" style="animation-delay:${i * 0.2}s">${shipSVG(P.color)}</span>`).join('')}</div>
      <div class="finalgrid"><ol class="rank frame">${r.map((P,i) => `<li><span>${medal(i)}</span><span>${shipSVG(P.color)}</span><span class="nm">${esc(P.name)}${P.bot ? '<span class="bot">BOT</span>' : ''}</span><span class="sc">${scoreOf(P)}</span><small>Shipment score · ${P.pts} game points</small></li>`).join('')}</ol>
      <div class="awards">${H.final.aw.map(a => `<div class="award"><span class="at">${a.ic} ${a.t}</span><span class="aw">${a.w.length ? esc(a.w.join(', ')) : '—'}</span><small>${a.d}</small></div>`).join('')}</div></div>
      <div class="finalbtns"><button class="btn" data-f="again">PLAY AGAIN, SAME PLAYERS</button><button class="btn ghost" data-f="new">NEW GAME</button></div></div>`);
    return;
  }
  ov.hidden = true; ov._h = null;
}
function updateTimers(){
  if (!H || H.phase === 'lobby') return;
  const t = $('#tvTimer'); if (!t) return;
  if (H.phase === 'question' || H.phase === 'boss'){
    const rem = H.lockedAt ? 0 : H.qEndAt - Date.now();
    t.textContent = fmtT(rem); t.classList.toggle('hot', rem < 6000);
    const f = $('#tbarFill'); if (f) f.style.width = Math.max(0, 100 * rem / (H.q.dur * 1000)).toFixed(1) + '%';
  } else { t.textContent = ''; }
  if (H.phase === 'countdown'){
    const e = Date.now() - H.cdAt; const txt = e < 1000 ? '3' : e < 2000 ? '2' : e < 3000 ? '1' : 'SHIP IT!';
    const ov = $('#overlay'); setHTML(ov, `<div class="count" style="${txt.length > 1 ? 'font-size:5em' : ''}">${txt}</div>`);
  }
}

async function startHost(resume){
  wake();
  if (resume){ H = resume; H.anim = null; plist().forEach(P => { if (!P.bot) P.conn = false; P.dpos = P.pos; });
    if (H.phase === 'question' || H.phase === 'boss'){ H.lockedAt = 0; H.qEndAt = Date.now() + 15000; plist().forEach(P => { if (P.bot && P.ans == null) P.botAt = Date.now() + rnd(2000, 9000); }); }
    if (H.phase === 'countdown') H.cdAt = Date.now();
  } else H = newHost();
  showView('tv'); renderTV();
  hostLoops.forEach(clearInterval);
  hostLoops = [setInterval(tick, 250), setInterval(() => { if (link) link.send(pub()); }, 2500)];
  document.addEventListener('keydown', e => { if (e.target.closest('input')) return; if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){ e.preventDefault(); onNext(); } });
  for (let attempt = 0; attempt < 3; attempt++){
    try { link = await hostNet(H.pin, onPlayerMsg, onPlayerLeave); netMsg = link.label; break; }
    catch (e){
      link = null;
      if (e && e.type === 'unavailable-id' && !resume){ H.pin = genPin(); continue; }
      netMsg = e && e.message === 'owner' ? 'Only the owner of this page can host a live game. You can still try it with AI ships.'
        : Net.kind === 'room' ? 'Live link unavailable on this page. You can still play against AI ships.'
        : 'Phones cannot connect from here. Host this file on a web address (see the notes), or test with AI ships.';
      break;
    }
  }
  if ($('#qr')) drawQR();
  push();
}

/* ===================== PHONE ===================== */
const ME = {cid:myCid(), name:'', color:'orange', pin:'', joined:false, tab:'ship', lockQ:null, lockC:null, deadline:0, dlKey:'', status:'connecting', seenTake:'', buzzed:''};
let S = null, plink = null;

function phoneJoinScreen(err){
  showView('phone');
  const saved = store.get('eq_me') || {};
  if (!ME.name) ME.name = saved.name || '';
  if (saved.color) ME.color = saved.color;
  const ph = $('#phone'); ph._h = null;
  ph.innerHTML = `<div class="card frame">
      ${BRAND.logo ? `<div style="text-align:center">${brandTile('ph')}</div>` : ''}
      <div class="logo" style="font-size:34px;text-align:center">EXPORT<br>QUEST</div>${BRAND.text ? `<div class="brand-line" style="text-align:center;font-size:11px">${esc(BRAND.text)}</div>` : ''}
      <form id="joinForm" class="pads" novalidate>
        <div class="field"><label for="jPin">GAME PIN</label><input id="jPin" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(ME.pin)}" placeholder="4827"></div>
        <div class="field"><label for="jName">NAME / NICKNAME</label><input id="jName" maxlength="14" autocomplete="nickname" value="${esc(ME.name)}" placeholder="Farah"></div>
        <div class="field"><label>CHOOSE YOUR SHIP</label><div class="colors" id="jColors">${COLORS.map(c => `<button type="button" data-k="${c.k}" aria-pressed="${c.k === ME.color}">${shipSVG(c.k)}<span>${c.n}</span></button>`).join('')}</div></div>
        ${err ? `<p class="err">${esc(err)}</p>` : ''}
        <button class="btn" type="submit" id="jGo">READY TO EXPORT!</button>
      </form></div>`;
  $('#jColors').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; ME.color = b.dataset.k; $('#jColors').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === ME.color)); };
  $('#joinForm').onsubmit = async e => {
    e.preventDefault();
    const pin = $('#jPin').value.replace(/\D/g,''); const name = cleanName($('#jName').value);
    if (pin.length !== 4) return phoneJoinScreen('Enter the 4-digit PIN from the big screen.');
    if (!$('#jName').value.trim()) return phoneJoinScreen('Pick a name so colleagues can find your ship.');
    ME.pin = pin; ME.name = name; store.set('eq_me', {name, color:ME.color});
    $('#jGo').disabled = true; $('#jGo').textContent = 'CONNECTING…';
    try {
      plink = await joinNet(pin, onState, st => { ME.status = st; renderPhone(); });
      ME.joined = true; wake(); sayHello(); renderPhone();
      setInterval(() => { if (!S || !S.ps.some(p => p.i === ME.cid)) sayHello(); }, 3000);
      setInterval(updatePhoneTimer, 250);
    } catch (err){
      phoneJoinScreen(Net.kind === 'room' ? 'Could not reach the game. Make sure you are signed in to claude.ai on this phone.' : 'This page cannot connect to the game. Open the link from the QR code on the big screen.');
    }
  };
}
function sayHello(){ if (plink) plink.send({t:'hello', cid:ME.cid, name:ME.name, color:ME.color}); }
function onState(s){
  if (!s || s.pin !== ME.pin || !Array.isArray(s.ps)) return;
  if (S && s.v != null && S.v != null && s.v < S.v && s.ph === S.ph) return;
  const key = s.q ? s.ph + s.q.id : s.ph;
  if (s.q && (s.ph === 'question' || s.ph === 'boss') && key !== ME.dlKey){ ME.dlKey = key; ME.deadline = Date.now() + s.q.rem; }
  if (s.q && ME.lockQ !== s.q.id && !(s.ph === 'question' || s.ph === 'boss')){ /* keep pick for reveal */ }
  S = s; ME.status = 'live'; renderPhone();
}
function answer(i){
  if (!S || !S.q || ME.lockQ === S.q.id || S.lk) return;
  ME.lockQ = S.q.id; ME.lockC = i; buzz(30);
  plink && plink.send({t:'ans', cid:ME.cid, q:S.q.id, c:i}); renderPhone();
}
function meOf(){ return S && S.ps.find(p => p.i === ME.cid); }
function rankOf(){ if (!S) return []; return S.ps.slice().sort((a,b) => sumScore(b.s) - sumScore(a.s) || b.g - a.g); }

function renderPhone(){
  if (!ME.joined) return;
  const el = $('#phone'), me = meOf();
  if (!S || !me){
    setHTML(el, `<div class="card frame center"><div class="bigship">${shipSVG(ME.color)}</div><h2>${ME.status === 'nohost' ? 'NO GAME ON PIN ' + esc(ME.pin) : 'JOINING GAME ' + esc(ME.pin) + '…'}</h2>
      <p class="note">${ME.status === 'nohost' ? 'Check the PIN on the big screen. Retrying automatically.' : 'Hold tight, the harbour master is checking you in.'}</p></div>`);
    return;
  }
  const score = sumScore(me.s);
  const head = `<div class="phead frame"><span>${shipSVG(me.c)}</span><div style="min-width:0"><div class="nm">${esc(me.n)}</div><div class="sub">${COLORS.find(c => c.k === me.c)?.n || ''} ship · ${me.p} / ${TRACK} · <span class="netdot ${ME.status === 'live' ? 'live' : ''}">${ME.status === 'live' ? '● live' : '○ reconnecting'}</span></div></div>
    <div class="score"><span class="tag">SCORE</span><b>${score}</b></div></div>
    <div class="bars">${SKEYS.map((k,i) => `<div class="bar"><span class="tag"><span>${STAT[k].n.toUpperCase()}</span><span>${me.s[i]}/${STAT[k].max}</span></span><span class="meter"><i style="width:calc(${(100 * me.s[i] / STAT[k].max).toFixed(1)}% - 4px);--c:${STAT[k].c}"></i></span></div>`).join('')}</div>`;
  setHTML(el, head + `<div id="pMain">${phoneMain(me)}</div>` + phoneTabs(me));
  const pads = el.querySelector('.pads[data-q]'); if (pads) pads.onclick = e => { const b = e.target.closest('[data-i]'); if (b) answer(+b.dataset.i); };
  const tabs = el.querySelector('.tabs'); if (tabs) tabs.onclick = e => { const b = e.target.closest('[data-t]'); if (b){ ME.tab = b.dataset.t; renderPhone(); } };
  phoneTakeover(me);
  updatePhoneTimer();
}
function resultCard(me, q){
  const l = me.l; if (!l || !q || l.q !== q.id) return `<div class="card frame"><p>Answers are in. Look at the big screen.</p></div>`;
  const key = l.q; if (ME.buzzed !== key){ ME.buzzed = key; buzz(l.ok ? [40] : [120,60,120]); }
  return `<div class="card frame"><div class="verdict ${l.ok ? 'ok' : 'no'}">${l.ok ? '✅ ' : '❌ '}${esc(l.h)}</div>
    ${l.fx && l.fx.length ? `<ul class="fxlist">${l.fx.map(f => `<li class="${/^\+/.test(f) ? 'up' : /^-/.test(f) || /no move|Miss|No movement/i.test(f) ? 'down' : ''}">${esc(f)}</li>`).join('')}</ul>` : ''}
    <p class="note">Right answer: <b style="color:var(--foam)">${esc(q.o[S.ok] || l.m || '')}</b></p>${S.why ? `<p class="why p">${esc(S.why)}</p>` : ''}</div>`;
}
function phoneMain(me){
  const ph = S.ph, q = S.q;
  if (ph === 'lobby') return `<div class="card frame center"><div class="bigship">${shipSVG(me.c)}</div><h2>READY TO EXPORT!</h2><p>${S.ps.length} ship${S.ps.length === 1 ? '' : 's'} in the lobby. Watch the big screen. The host starts the race.</p></div>`;
  if (ph === 'countdown') return `<div class="card frame center"><h2 style="font-size:30px">GET READY</h2><p>Your ship is at Alexandria. Questions appear here.</p></div>`;
  if ((ph === 'question' || ph === 'boss') && q){
    const locked = ME.lockQ === q.id || me.a;
    const top = ph === 'boss' ? `<div class="bossmini"><span>${BOSS_SVG}</span><div class="hp"><span class="tag">THE ROLLOVER · ${S.boss ? S.boss.hp : 100} HP</span><div class="hpbar"><i style="width:${S.boss ? S.boss.hp : 100}%"></i></div></div></div>`
      : `<div class="qhead"><span class="mission">${q.k === 'crisis' ? '🚨 CRISIS ALERT' : 'MISSION ' + S.qn}</span><span class="tag">${esc(q.st)}</span><span class="ptimer" id="pTimer" style="margin-left:auto"></span></div>`;
    if (locked || S.lk){
      const n = S.ps.filter(p => p.a).length;
      return `<div class="card frame">${top}<h2>${esc(q.ti)}</h2><div class="lockbox"><div class="big">${locked ? 'ANSWER LOCKED 🔒' : 'TIME’S UP'}</div>${locked && ME.lockQ === q.id ? `<p>You picked <b>${LET[ME.lockC]}: ${esc(q.o[ME.lockC])}</b></p>` : ''}<p class="note">${S.lk ? 'Answers locked. Look up at the big screen.' : `Wait for the other players… ${n} / ${S.ps.length} answered`}</p></div></div>`;
    }
    return `<div class="card frame">${top}<h2>${esc(q.ti)}</h2><p>${esc(q.tx)}</p>
      <div class="pads" data-q="${esc(q.id)}">${q.o.map((t,i) => `<button class="pad" data-i="${i}" style="--oc:${OPT_C[i]}"><span class="L">${LET[i]}</span><span>${esc(t)}</span></button>`).join('')}</div>
      ${ph === 'boss' ? '<p class="note">Team round: every correct answer hurts the Rollover. <span class="ptimer" id="pTimer"></span></p>' : ''}</div>`;
  }
  if (ph === 'reveal') return resultCard(me, q);
  if (ph === 'bossReveal'){
    const L = S.boss && S.boss.last;
    return `<div class="card frame"><div class="bossmini"><span>${BOSS_SVG}</span><div class="hp"><span class="tag">THE ROLLOVER · ${S.boss.hp} HP</span><div class="hpbar"><i style="width:${S.boss.hp}%"></i></div></div></div>
      ${L ? `<div class="verdict ${L.dmg ? 'ok' : 'no'}">${L.pct}% CORRECT · ${L.dmg ? '-' + L.dmg + ' HP' : 'IT ATTACKS!'}</div>` : ''}</div>` + resultCard(me, q);
  }
  if (ph === 'bossIntro') return `<div class="card frame center"><div class="bigship" style="width:140px">${BOSS_SVG}</div><h2>BOSS BATTLE: THE ROLLOVER</h2><p>This round you are all on the same team. Answer right to hit it hard.</p></div>`;
  if (ph === 'bossEnd'){ const won = S.boss && S.boss.end === 'won'; return `<div class="card frame center"><h2>${won ? 'ROLLOVER DEFEATED!' : 'THE ROLLOVER ESCAPED'}</h2><p>${won ? 'Team bonus: +50 points, +3 Customer, +2 Time.' : 'No team bonus. Back to the race.'}</p></div>`; }
  if (ph === 'event'){
    const mine = S.ev && S.ev.some(e => e.i === me.i);
    if (mine && me.l) return `<div class="card frame center"><div style="font-size:56px">${me.l.ic || '📡'}</div><div class="verdict ${me.l.ok ? 'ok' : 'no'}">${esc(me.l.h)}</div><p>${esc(me.l.m)}</p><ul class="fxlist">${me.l.fx.map(f => `<li class="${/^\+/.test(f) ? 'up' : 'down'}">${esc(f)}</li>`).join('')}</ul></div>`;
    return `<div class="card frame"><h2>📡 EVENTS ON THE ROUTE</h2><ul class="fxlist">${(S.ev || []).map(e => { const p = S.ps.find(x => x.i === e.i); return `<li>${e.ic} ${esc(p ? p.n : '')}: ${esc(e.t)}</li>`; }).join('')}</ul><p class="note">Nothing hit your ship this time.</p></div>`;
  }
  if (ph === 'arrived') return `<div class="card frame center"><h2>🚢 FIRST SHIP HAS ARRIVED!</h2><p>${esc(S.ar)} docked first.${me.p >= TRACK ? ' You are in port too.' : ''} One final turn for everyone, then scores are counted.</p></div>`;
  if (ph === 'final' && S.fin){
    const pos = S.fin.rank.indexOf(me.i);
    const mine = S.fin.aw.filter(a => a.w.includes(me.n));
    return `<div class="card frame center"><h2>EXPORT QUEST COMPLETE</h2><div class="big" style="font-size:40px">${medal(pos)}</div><p>You finished #${pos + 1} of ${S.fin.rank.length} with a shipment score of ${sumScore(me.s)}.</p>
      ${mine.length ? `<ul class="fxlist">${mine.map(a => `<li class="up">${a.ic} ${a.t}</li>`).join('')}</ul>` : '<p class="note">No award this time. Fastest is not always best.</p>'}</div>`;
  }
  return `<div class="card frame"><p>Watch the big screen.</p></div>`;
}
function phoneTabs(me){
  const t = ME.tab;
  let body = '';
  if (t === 'ship'){
    const cur = stageOf(me.p);
    const idx = STAGES.findIndex(s => s.n === cur);
    body = `<ol class="route frame">${STAGES.map((s,i) => `${i ? '<li class="arrow" aria-hidden="true">⬇</li>' : ''}<li class="${i < idx ? 'past' : i === idx ? 'now' : ''}"><span class="dot"></span><span>${s.n === 'SEA' ? '🌊 ' : ''}${s.n}</span>${i === idx ? `<span class="mini">${shipSVG(me.c)}</span>` : '<span></span>'}</li>`).join('')}</ol>`;
  } else if (t === 'scores'){
    body = `<div class="card frame sclist">${SKEYS.map((k,i) => `<div class="scrow"><b>${STAT[k].i} ${STAT[k].n.toUpperCase()}</b><span>${me.s[i]} / ${STAT[k].max}</span><span class="meter"><i style="width:${(100 * me.s[i] / STAT[k].max).toFixed(1)}%;--c:${STAT[k].c}"></i></span></div>`).join('')}
      <div class="scrow"><b>SHIPMENT SCORE</b><span style="color:var(--paper)">${sumScore(me.s)} / 100</span></div>
      <div class="scrow"><b>GAME POINTS</b><span>${me.g}</span></div><p class="note">Winner = best shipment score. Game points break ties.</p></div>`;
  } else {
    body = `<ol class="lb">${rankOf().map((p,i) => `<li class="${p.i === me.i ? 'me' : ''}"><span>${medal(i)}</span><span>${shipSVG(p.c)}</span><span class="nm">${esc(p.n)}${p.b ? '<span class="bot">BOT</span>' : ''}</span><span class="sc">${sumScore(p.s)}</span></li>`).join('')}</ol>`;
  }
  return `<div class="tabs" role="tablist">${[['ship','MY SHIPMENT'],['scores','MY SCORES'],['board','LEADERBOARD']].map(([k,n]) => `<button role="tab" data-t="${k}" aria-selected="${t === k}">${n}</button>`).join('')}</div>${body}`;
}
function phoneTakeover(me){
  const tk = $('#takeover');
  if (S.ph === 'event' && S.ev && S.ev.some(e => e.i === me.i) && me.l && ME.seenTake !== 'ev' + S.evk){
    ME.seenTake = 'ev' + S.evk;
    buzz(me.l.ok ? [60,40,60] : [200,80,200]);
    tk.style.setProperty('--c', me.l.ok ? 'var(--ok)' : 'var(--bad)');
    tk.innerHTML = `<div><div class="ic">${me.l.ic || ''}</div><h1>${esc(me.n)}</h1><h1>${esc(me.l.h)}</h1><p>${esc(me.l.m)}</p><ul>${me.l.fx.map(f => `<li>${esc(f)}</li>`).join('')}</ul><small>Tap to close</small></div>`;
    tk.hidden = false; tk.onclick = () => tk.hidden = true;
    setTimeout(() => tk.hidden = true, 4500);
  }
}
function updatePhoneTimer(){
  const t = $('#pTimer'); if (!t || !S || !S.q) return;
  const rem = S.lk ? 0 : ME.deadline - Date.now(); t.textContent = fmtT(rem); t.classList.toggle('hot', rem < 6000);
}

/* ===================== LANDING ===================== */
function showView(v){ ['landing','tv','phone'].forEach(id => $('#' + id).hidden = id !== v); }
function landing(){
  showView('landing');
  const saved = store.get('eq_host');
  const canResume = saved && saved.H && saved.H.phase !== 'final' && saved.H.phase !== 'lobby' && Date.now() - saved.at < 6 * 3600e3;
  $('#landing').innerHTML = `<div class="land">
    ${BRAND.logo ? `<div class="brand-row">${brandTile('')}${brandLine()}</div>` : ''}
    <div class="hero-ship">${shipSVG('orange')}</div>
    <div class="logo">EXPORT<br>QUEST</div>
    <p>A live race through an export shipment, from the Alexandria warehouse to the customer’s door. Fastest is not always best.</p>
    <div class="land-actions">
      <div class="land-card frame"><h2>BIG SCREEN</h2><p>Open this on the TV or projector. Shows the QR code, the race and the leaderboard.</p><button class="btn" id="hostBtn">HOST A GAME</button>
        ${canResume ? `<button class="btn ghost" id="resumeBtn">RESUME PIN ${esc(saved.H.pin)}</button>` : ''}</div>
      <div class="land-card frame"><h2>PLAYER</h2><p>Join from your phone with the PIN on the big screen.</p><button class="btn alt" id="joinBtn">JOIN WITH A PIN</button></div>
    </div>
    <p class="note" id="landNote"></p></div>`;
  $('#hostBtn').onclick = () => { sfx('tick'); startHost(null); };
  if (canResume) $('#resumeBtn').onclick = () => startHost(saved.H);
  $('#joinBtn').onclick = () => phoneJoinScreen();
  Net.ready.then(() => { const n = $('#landNote'); if (!n) return;
    n.textContent = Net.kind === 'room' ? 'Players need to be signed in to claude.ai and have access to this page.'
      : Net.kind === 'peer' ? 'Phones join by scanning the QR code. No app needed.' : 'Live play is not available here. You can still try the game against AI ships.'; });
}
(function boot(){
  let pin = null;
  try { pin = new URLSearchParams(location.search).get('join'); } catch {}
  if (pin && /^\d{4}$/.test(pin)){ ME.pin = pin; phoneJoinScreen(); } else landing();
})();
</script>
